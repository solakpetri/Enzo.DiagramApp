name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build

      - name: Pack CLI tool
        run: dotnet pack src/Enzo.Diagrams.Cli --configuration Release --output "$RUNNER_TEMP/packages"

      - name: Install and run packaged CLI tool
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-enzo" value="$RUNNER_TEMP/packages" />
            </packageSources>
          </configuration>
          EOF

          dotnet tool install Enzo.Diagrams.Cli --version 0.1.0 --tool-path "$RUNNER_TEMP/tool" --configfile "$RUNNER_TEMP/nuget.config"

          diagram="$RUNNER_TEMP/diagram.enzo"
          cat > "$diagram" <<'EOF'
          flow Checkout

          start Begin "Order received"
          task Validate "Validate order"
          end Complete "Complete order"

          Begin -> Validate
          Validate -> Complete
          EOF

          "$RUNNER_TEMP/tool/enzo-diagram" validate "$diagram"
          "$RUNNER_TEMP/tool/enzo-diagram" render "$diagram"
          "$RUNNER_TEMP/tool/enzo-diagram" render "$diagram" --format png
